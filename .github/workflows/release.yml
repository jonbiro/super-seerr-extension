name: Prepare release
on:
  workflow_dispatch:
    inputs:
      sign_firefox:
        description: 'Sign Firefox for self-distribution (requires Mozilla secrets)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: make release
      - name: Sign prepared Firefox build
        if: inputs.sign_firefox
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: node scripts/sign-firefox.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: |
            super-seerr-v*-chrome.zip
            super-seerr-v*-firefox.xpi
            super-seerr-v*-SHA256SUMS.txt
            dist/signed-firefox/*.xpi
          if-no-files-found: error
